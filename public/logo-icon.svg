<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Novaris Official Brand Gradient -->
    <linearGradient id="novarisGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#119CFF"/>
      <stop offset="50%" stop-color="#287BFF"/>
      <stop offset="100%" stop-color="#663BFF"/>
    </linearGradient>
    <linearGradient id="navyStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051433"/>
      <stop offset="100%" stop-color="#071D49"/>
    </linearGradient>
    <linearGradient id="blueOverlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D49"/>
      <stop offset="100%" stop-color="#287BFF"/>
    </linearGradient>
  </defs>

  <!-- Left Stem of N (Navy Ribbon) -->
  <path d="M 22 108 L 22 28 C 22 18, 29 12, 38 18 L 60 36 C 68 42, 68 54, 58 64 L 38 84 C 28 94, 22 102, 22 108 Z" fill="url(#navyStemGrad)"/>

  <!-- Folded Diagonal connecting to P Loop (Deep Blue Translucent Fold) -->
  <path d="M 22 108 C 22 108, 30 114, 42 102 L 68 76 C 76 68, 86 68, 92 76 C 98 84, 92 98, 80 106 L 68 112 C 58 116, 44 114, 34 108 Z" fill="url(#blueOverlapGrad)"/>

  <!-- Loop of P & Upper N (Main Novaris Gradient) -->
  <path d="M 38 18 C 50 8, 76 8, 92 20 C 108 32, 108 58, 92 70 C 76 82, 54 82, 42 70 L 42 52 C 50 60, 68 60, 80 50 C 90 40, 90 26, 80 20 C 68 14, 50 16, 38 28 Z" fill="url(#novarisGrad)"/>

  <!-- 3 Horizontal Speed Lines inside the P Loop -->
  <rect x="52" y="32" width="22" height="3.5" rx="1.75" fill="#119CFF"/>
  <rect x="52" y="42" width="28" height="3.5" rx="1.75" fill="#119CFF"/>
  <rect x="52" y="52" width="18" height="3.5" rx="1.75" fill="#119CFF"/>
</svg>
