<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" fill="none">
  <defs>
    <linearGradient id="novarisGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#119CFF"/>
      <stop offset="50%" stop-color="#287BFF"/>
      <stop offset="100%" stop-color="#663BFF"/>
    </linearGradient>
    <linearGradient id="navyGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051433"/>
      <stop offset="100%" stop-color="#071D49"/>
    </linearGradient>
    <linearGradient id="blueOverlapFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D49"/>
      <stop offset="100%" stop-color="#287BFF"/>
    </linearGradient>
    <linearGradient id="lineBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#119CFF"/>
      <stop offset="100%" stop-color="#287BFF"/>
    </linearGradient>
    <linearGradient id="lineVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#287BFF"/>
      <stop offset="100%" stop-color="#663BFF"/>
    </linearGradient>
  </defs>

  <!-- Group 1: NP Emblem Icon -->
  <g transform="translate(10, 10) scale(0.95)">
    <!-- Left Stem of N (Navy Ribbon) -->
    <path d="M 22 108 L 22 28 C 22 18, 29 12, 38 18 L 60 36 C 68 42, 68 54, 58 64 L 38 84 C 28 94, 22 102, 22 108 Z" fill="url(#navyGradFull)"/>
    <!-- Folded Diagonal connecting to P Loop -->
    <path d="M 22 108 C 22 108, 30 114, 42 102 L 68 76 C 76 68, 86 68, 92 76 C 98 84, 92 98, 80 106 L 68 112 C 58 116, 44 114, 34 108 Z" fill="url(#blueOverlapFull)"/>
    <!-- Loop of P & Upper N -->
    <path d="M 38 18 C 50 8, 76 8, 92 20 C 108 32, 108 58, 92 70 C 76 82, 54 82, 42 70 L 42 52 C 50 60, 68 60, 80 50 C 90 40, 90 26, 80 20 C 68 14, 50 16, 38 28 Z" fill="url(#novarisGradFull)"/>
    <!-- 3 Horizontal Speed Lines -->
    <rect x="52" y="32" width="22" height="3.5" rx="1.75" fill="#119CFF"/>
    <rect x="52" y="42" width="28" height="3.5" rx="1.75" fill="#119CFF"/>
    <rect x="52" y="52" width="18" height="3.5" rx="1.75" fill="#119CFF"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="148" y1="28" x2="148" y2="108" stroke="#071D49" stroke-width="2" stroke-linecap="round"/>

  <!-- Group 2: Wordmark "NovarisPay" -->
  <text x="175" y="72" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
    <tspan fill="#071D49">Novaris</tspan>
    <tspan fill="#663BFF">Pay</tspan>
  </text>

  <!-- Group 3: Subtitle with Accent Lines -->
  <!-- Left Accent Line -->
  <line x1="175" y1="96" x2="200" y2="96" stroke="url(#lineBlueGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtitle Text -->
  <text x="210" y="100" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#64748B" letter-spacing="1">
    HR &amp; Payroll Management System
  </text>

  <!-- Right Accent Line -->
  <line x1="500" y1="96" x2="525" y2="96" stroke="url(#lineVioletGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
